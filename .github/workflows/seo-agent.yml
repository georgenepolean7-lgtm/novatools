name: Autonomous SEO Agent

on:
  schedule:
    # Run once daily at 06:00 IST (00:30 UTC)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run mode (analysis and scoring only, no file mutations)'
        required: false
        default: false
        type: boolean
      max_pages:
        description: 'Maximum pages to optimize (clamped between 1 and 40)'
        required: false
        default: '40'
        type: string
      slug:
        description: 'Target single tool slug (optional override)'
        required: false
        default: ''
        type: string

concurrency:
  group: seo-agent-cycle
  cancel-in-progress: false

jobs:
  run-seo-cycle:
    name: Execute Autonomous SEO Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config --global user.name "Nova Tools SEO Agent"
          git config --global user.email "seo-agent@novatool.in"

      - name: Execute Autonomous SEO Agent
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://novatool.in' }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CLIENT_EMAIL: ${{ secrets.GA4_CLIENT_EMAIL }}
          GA4_PRIVATE_KEY: ${{ secrets.GA4_PRIVATE_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CLOUD_AI_API_KEY: ${{ secrets.CLOUD_AI_API_KEY }}
          CLOUD_AI_ENDPOINT: ${{ secrets.CLOUD_AI_ENDPOINT }}
          CLOUD_AI_MODEL: ${{ secrets.CLOUD_AI_MODEL || 'qwen3:4b' }}
          REAL_SEO_DATA_REQUIRED: ${{ secrets.REAL_SEO_DATA_REQUIRED || 'true' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.max_pages }}" ]; then
            ARGS="$ARGS --max-pages ${{ github.event.inputs.max_pages }}"
          fi
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ github.event.inputs.slug }}"
          fi
          node scripts/run-seo-cycle.js $ARGS

      - name: Upload SEO Audit State Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-agent-audit-state-${{ github.run_id }}
          path: |
            data/seo-agent/agent-state.json
          retention-days: 30
